 [tool.poetry]
 name = "ai-mikrotik-backend"
 version = "0.1.0"
 description = "AI-driven MikroTik network management platform backend"
 authors = ["AI System Architect <ai@mikrotik-platform.local>"]
 readme = "README.md"

 [tool.poetry.dependencies]
 python = "^3.11"
 fastapi = "^0.115.0"
 uvicorn = { extras = ["standard"], version = "^0.30.0" }
 httpx = "^0.27.0"
 pydantic = "^2.8.0"
 pydantic-settings = "^2.4.0"
 sqlalchemy = "^2.0.30"
 alembic = "^1.13.1"
 asyncpg = "^0.29.0"
 redis = "^5.0.4"
 python-socketio = { version = "^5.11.1", extras = ["client"] }
 apscheduler = "^3.10.4"
 tenacity = "^8.2.3"
 typer = "^0.12.4"
 loguru = "^0.7.2"
 beautifulsoup4 = "^4.12.3"
 lxml = "^5.2.1"
 aiofiles = "^23.2.1"
 aiohttp = "^3.9.5"
 paramiko = "^3.4.0"
 python-dotenv = "^1.0.1"
 msgspec = "^0.18.4"

 [tool.poetry.group.dev.dependencies]
 pytest = "^8.2.0"
 pytest-asyncio = "^0.23.6"
 httpx = {version = "^0.27.0", extras = ["cli"] }
 ruff = "^0.4.10"
 mypy = "^1.10.0"

 [build-system]
 requires = ["poetry-core>=1.7.0"]
 build-backend = "poetry.core.masonry.api"
